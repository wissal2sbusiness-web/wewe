<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WESIE | Official Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #070305;
      color: #fff;
    }

    /* Background Image Container (Bg.jpg) */
    .bg-container {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background-color: #070305;
    }

    .bg-media {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,3,5,0.4) 0%, rgba(7,3,5,0.2) 50%, rgba(7,3,5,0.7) 100%);
      z-index: -1;
    }

    /* Main Container Layout */
    .content-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 45px 20px;
      text-align: center;
      transition: all 0.5s ease;
    }

    .top-section {
      margin-top: 15px;
      animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .sparkle {
      font-size: 16px;
      color: #dfb15b;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(223, 177, 91, 0.6);
      animation: pulseSparkle 2s infinite ease-in-out;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: 9px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }

    .brand-subtitle {
      font-family: 'Cinzel', serif;
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 6px;
      color: #dfb15b;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .middle-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 350px;
      animation: zoomIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Initial YES, I'M 18 Button */
    .enter-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      background: rgba(245, 230, 208, 0.92);
      color: #2b2b2b;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      backdrop-filter: blur(5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      animation: creamyGlowPulse 2.5s infinite ease-in-out;
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: #ffffff;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 35px rgba(245, 230, 208, 0.3);
    }

    /* Exclusive Content Button (Revealed with professional smooth animation) */
    .primary-dest-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 58px;
      background: rgba(245, 230, 208, 0.92);
      color: #2b2b2b;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .primary-dest-btn.animate-in {
      display: flex;
      animation: professionalReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .primary-dest-btn:hover {
      background: #ffffff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 35px rgba(245, 230, 208, 0.4);
    }

    .bottom-section {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      width: 100%;
    }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      color: #e2e2e2;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    /* Small, Elegant Social Icons Row (Revealed with professional smooth animation) */
    .social-icons-row {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      opacity: 0;
      transform: translateY(20px);
    }

    .social-icons-row.animate-in {
      display: flex;
      animation: professionalReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .social-icon-link {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(245, 230, 208, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5e6d0;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(5px);
    }

    .social-icon-link:hover {
      transform: translateY(-3px) scale(1.1);
      background: rgba(245, 230, 208, 0.25);
      border-color: #fff;
      color: #fff;
      box-shadow: 0 0 15px rgba(245, 230, 208, 0.4);
    }

    .social-icon-link svg {
      width: 16px;
      height: 16px;
    }

    .footer-signature {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 3px;
      color: #a8a8a8;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* Professional Security Scan Modal */
    #security-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 3, 5, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 20px;
    }

    .modal-box {
      background: rgba(20, 10, 15, 0.95);
      border: 1px solid rgba(245, 230, 208, 0.3);
      border-radius: 24px;
      width: 100%;
      max-width: 330px;
      padding: 32px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 12px;
    }

    .modal-desc {
      font-size: 12.5px;
      color: #d1d1d1;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .scanner-loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(245, 230, 208, 0.2);
      border-top-color: #f5e6d0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Professional Smooth Reveal Animation */
    @keyframes professionalReveal {
      0% { opacity: 0; transform: translateY(25px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulseSparkle {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; text-shadow: 0 0 18px rgba(245, 230, 208, 0.9); }
    }

    @keyframes creamyGlowPulse {
      0%, 100% { 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 15px rgba(245, 230, 208, 0.15); 
      }
      50% { 
        box-shadow: 0 15px 35px rgba(245, 230, 208, 0.3), 0 0 25px rgba(245, 230, 208, 0.4); 
      }
    }
  </style>
</head>
<body>

  <!-- Background Image (Bg.jpg) -->
  <div class="bg-container">
    <img src="Bg.jpg" alt="Background" class="bg-media">
  </div>
  <div class="bg-overlay"></div>

  <!-- Main Content Layout -->
  <div class="content-wrapper" id="main-wrapper">
    
    <!-- Top Header -->
    <div class="top-section">
      <div class="sparkle">✦</div>
      <h1 class="brand-title">WESIE</h1>
      <div class="brand-subtitle">Exclusive Space</div>
    </div>

    <!-- Center Interactive Area -->
    <div class="middle-section">
      <!-- Initial YES, I'M 18 Button (Triggers Scan) -->
      <button class="enter-btn" id="main-action-btn" onclick="startSecurityScan()">
        YES, I'M 18
      </button>

      <!-- Exclusive Content Button (Revealed with professional animation after scan) -->
      <a href="https://www.stacked.com/@wslo/membership?lang=en" class="primary-dest-btn" id="exclusive-btn" target="_blank" rel="noopener external">
        Exclusive Content | Come Talk To Me
      </a>
    </div>

    <!-- Bottom Footer Elements -->
    <div class="bottom-section">
      <div class="quote-text">Some things are better a little closer.</div>
      
      <!-- 5 Social Media Icons Row (Revealed with professional animation after scan) -->
      <div class="social-icons-row" id="social-icons-row">
        
        <!-- Instagram -->
        <a href="https://www.instagram.com/wsloffcial" class="social-icon-link" target="_blank" rel="noopener external" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <!-- TikTok -->
        <a href="https://www.tiktok.com/@wesuie" class="social-icon-link" target="_blank" rel="noopener external" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5v3a3 3 0 0 1-3-3v7a8 8 0 1 1-8-8v3a5 5 0 0 0 5 5z"></path>
          </svg>
        </a>

        <!-- Telegram -->
        <a href="https://t.me/+zjFOawc7051hNzM8" class="social-icon-link" target="_blank" rel="noopener external" aria-label="Telegram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </a>

        <!-- Threads -->
        <a href="https://www.threads.net" class="social-icon-link" target="_blank" rel="noopener external" aria-label="Threads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10c0 2.21-.88 4.31-2.43 5.86-1.55 1.55-3.65 2.43-5.86 2.43h-1.71c-1.89 0-3.43-1.54-3.43-3.43V12a3 3 0 1 0-6 0c0 1.66 1.34 3 3 3h4"></path>
          </svg>
        </a>

        <!-- Patreon -->
        <a href="https://www.patreon.com" class="social-icon-link" target="_blank" rel="noopener external" aria-label="Patreon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="15" cy="9" r="6"></circle>
            <line x1="5" y1="3" x2="5" y2="21"></line>
          </svg>
        </a>

      </div>

      <div class="footer-signature">With Love, Wesie</div>
    </div>

  </div>

  <!-- Advanced Security Scan Modal -->
  <div id="security-modal">
    <div class="modal-box">
      <div class="modal-title">HUMAN VERIFICATION</div>
      <div class="scanner-loader"></div>
      <p class="modal-desc" id="security-status">Scanning session & filtering bots...</p>
    </div>
  </div>

  <script>
    // Advanced Security Check Logic with Professional Reveal Animation
    function startSecurityScan() {
      const modal = document.getElementById('security-modal');
      const statusText = document.getElementById('security-status');
      
      modal.style.display = 'flex';
      statusText.innerText = "Scanning device fingerprint...";

      setTimeout(() => {
        statusText.innerText = "Validating human interaction...";
      }, 700);

      setTimeout(() => {
        // Hide modal and initial button
        modal.style.display = 'none';
        document.getElementById('main-action-btn').style.display = 'none';
        
        // Reveal the Exclusive Button and Social Icons Row with smooth professional animation
        document.getElementById('exclusive-btn').classList.add('animate-in');
        document.getElementById('social-icons-row').classList.add('animate-in');
      }, 1500);
    }
  </script>
</body>
</html>
